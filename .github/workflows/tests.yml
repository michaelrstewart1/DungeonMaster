name: Tests

# Backend pytest + frontend vitest/typecheck on every PR and push to main.
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: |
          cd backend
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: |
          cd backend
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: |
          cd frontend
          npm ci

      - name: Typecheck + build
        run: |
          cd frontend
          npm run build

      - name: Run vitest
        run: |
          cd frontend
          npx vitest run
