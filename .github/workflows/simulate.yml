name: Simulate (bot harness smoke)

# Runs the headless 3-bot smoke scenario against the FastAPI backend with
# keyword-mock narration (no LLM, no GPU). Designed to catch regressions in
# the multiplayer WebSocket protocol on every PR.

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/simulate/**"
      - ".github/workflows/simulate.yml"
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "scripts/simulate/**"
      - ".github/workflows/simulate.yml"
  workflow_dispatch: {}

jobs:
  simulate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            scripts/simulate/requirements.txt

      - name: Install backend
        run: |
          cd backend
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install harness deps (Phase 1 subset only — no AutoGen)
        run: |
          python -m pip install "httpx>=0.27" "websockets>=12.0"

      - name: Boot backend (mock narration)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./_simulate_ci.db"
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 --log-level warning > backend.log 2>&1 &
          # Wait up to 30s for /api/health.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/api/health > /dev/null; then
              echo "backend up"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/api/health

      - name: Run smoke scenario
        run: |
          python -m scripts.simulate.runner \
            --scenario smoke \
            --base-url http://127.0.0.1:8765 \
            --timeout 30

      - name: Run resume/rejoin scenario
        run: |
          python -m scripts.simulate.runner \
            --scenario resume_rejoin \
            --base-url http://127.0.0.1:8765 \
            --timeout 60

      - name: Run combat loop scenario
        run: |
          python -m scripts.simulate.runner \
            --scenario combat_loop \
            --base-url http://127.0.0.1:8765 \
            --timeout 60

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulate-smoke-run
          path: |
            runs/
            backend/backend.log
          if-no-files-found: warn
