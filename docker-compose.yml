# Production Docker Compose — Full Stack AI Dungeon Master
services:
  # --- Frontend ---
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # --- Backend API ---
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DM_DATABASE_URL=postgresql+asyncpg://dm:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/dungeon_master
      - DM_REDIS_URL=redis://redis:6379/0
      - DM_LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - DM_LLM_FALLBACK_PROVIDER=${DM_LLM_FALLBACK_PROVIDER:-}
      - DM_OLLAMA_MODEL=${LLM_MODEL:-llama3.1:8b}
      - DM_OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - DM_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DM_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DM_GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DM_GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DM_TTS_ENGINE=${TTS_PROVIDER:-piper}
      - DM_OPENAI_TTS_VOICE=${DM_OPENAI_TTS_VOICE:-onyx}
      - DM_OPENAI_TTS_MODEL=${DM_OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      - DM_STT_PROVIDER=${DM_STT_PROVIDER:-auto}
      - DM_STT_MODEL=${DM_STT_MODEL:-base.en}
      - DM_STT_DEVICE=${DM_STT_DEVICE:-cpu}
      - DM_VISION_CAMERA_DEVICE=${DM_VISION_CAMERA_DEVICE:--1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/data
      # Generated art must survive container rebuilds — sessions persist
      # /api/scene-images/... URLs that would otherwise dangle.
      - backend_scenes:/app/app/generated_scenes
      - backend_portraits:/app/app/generated_portraits
    restart: unless-stopped

  # --- Databases ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dungeon_master
      POSTGRES_USER: dm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm -d dungeon_master"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Local LLM (optional) ---
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    profiles:
      - local-llm
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  ollama_models:
  backend_data:
  backend_scenes:
  backend_portraits:
